[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aem-troubleshooting-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets AI assistants diagnose Adobe Experience Manager instances"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Manpreet Singh" }]
keywords = ["aem", "adobe-experience-manager", "mcp", "model-context-protocol", "troubleshooting", "sre"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "mcp>=2.3,<3",
    "aem-log-analyzer @ git+https://github.com/navi00498/aem-log-analyzer.git@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/navi00498/aem-troubleshooting-mcp-server"

[project.scripts]
aem-troubleshooting-mcp = "aem_mcp.server:main"
aem-mock-server = "aem_mcp.mock_aem:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aem_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
